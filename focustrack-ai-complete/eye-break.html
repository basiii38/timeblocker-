<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eye Break</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.3s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    body.fade-out {
      animation: fadeOut 0.3s ease-out forwards;
    }
    .container {
      text-align: center;
      color: white;
      max-width: 600px;
    }
    .icon {
      font-size: 120px;
      margin-bottom: 30px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    h1 {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 20px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }
    .message {
      font-size: 24px;
      line-height: 1.6;
      margin-bottom: 30px;
      opacity: 0.95;
    }
    .countdown {
      font-size: 72px;
      font-weight: 700;
      margin: 20px 0;
      text-shadow: 0 3px 15px rgba(0, 0, 0, 0.4);
    }
    .tip {
      font-size: 18px;
      opacity: 0.85;
      font-style: italic;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">👀</div>
    <h1>Time for an Eye Break!</h1>
    <div class="message">
      Look at something 20 feet away for 20 seconds<br>
      Give your eyes a rest 🌿
    </div>
    <div class="countdown" id="countdown">3</div>
    <div class="tip">The 20-20-20 rule: Every 20 minutes, look 20 feet away for 20 seconds</div>
  </div>

  <script>
    let seconds = 3;
    const countdownEl = document.getElementById('countdown');

    const interval = setInterval(() => {
      seconds--;
      countdownEl.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(interval);
        // Add fade out animation
        document.body.classList.add('fade-out');
        setTimeout(() => {
          window.close();
        }, 300);
      }
    }, 1000);

    // Allow user to close early by pressing any key or clicking
    document.addEventListener('keydown', () => {
      clearInterval(interval);
      document.body.classList.add('fade-out');
      setTimeout(() => {
        window.close();
      }, 300);
    });

    document.addEventListener('click', () => {
      clearInterval(interval);
      document.body.classList.add('fade-out');
      setTimeout(() => {
        window.close();
      }, 300);
    });
  </script>
</body>
</html>
