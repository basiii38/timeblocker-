<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Blocked - FocusTrack AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 60px 40px;
      text-align: center;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    h1 {
      color: #2d3748;
      font-size: 32px;
      margin-bottom: 10px;
    }
    .domain {
      color: #667eea;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 30px;
    }
    .message {
      color: #4a5568;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 40px;
    }
    .motivation {
      background: #f7fafc;
      border-left: 4px solid #667eea;
      padding: 20px;
      margin-bottom: 40px;
      font-style: italic;
      color: #2d3748;
      border-radius: 4px;
    }
    button {
      padding: 15px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: #667eea;
      color: white;
    }
    button:hover {
      background: #5568d3;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🚫</div>
    <h1>This site is blocked</h1>
    <div class="domain" id="domain">loading...</div>
    <div class="message">
      You've blocked this site to stay focused and productive. Keep up the great work!
    </div>
    <div class="motivation" id="quote">
      "Focus on being productive instead of busy." - Tim Ferriss
    </div>
    <button id="goBackBtn">← Go Back</button>
  </div>

  <script>
    const quotes = [
      "Focus on being productive instead of busy. - Tim Ferriss",
      "The key is not to prioritize what's on your schedule, but to schedule your priorities. - Stephen Covey",
      "Concentrate all your thoughts upon the work in hand. - Alexander Graham Bell",
      "Action is the foundational key to all success. - Pablo Picasso",
      "The way to get started is to quit talking and begin doing. - Walt Disney"
    ];

    // Get domain from URL params
    const params = new URLSearchParams(window.location.search);
    const domain = params.get('domain') || 'this site';
    document.getElementById('domain').textContent = domain;

    // Set random quote
    document.getElementById('quote').textContent = quotes[Math.floor(Math.random() * quotes.length)];

    // Attach event listener properly
    document.getElementById('goBackBtn').addEventListener('click', () => {
      window.history.back();
    });
  </script>
</body>
</html>
