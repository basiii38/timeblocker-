<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusTrack AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
    }

    .container {
      padding: 16px;
    }

    .header {
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: #6b7280;
    }

    .score-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
      padding: 24px;
      color: white;
      margin-bottom: 16px;
    }

    .score-label {
      font-size: 12px;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .score-value {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .score-details {
      font-size: 13px;
      opacity: 0.9;
    }

    .section {
      background: white;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #e5e7eb;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 12px;
    }

    .current-site {
      margin-bottom: 8px;
    }

    .current-domain {
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 4px;
    }

    .current-time {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .category-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .productive {
      background: #d1fae5;
      color: #065f46;
    }

    .distracting {
      background: #fee2e2;
      color: #991b1b;
    }

    .neutral {
      background: #fef3c7;
      color: #92400e;
    }

    .focus-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
    }

    .btn-full {
      width: 100%;
      padding: 12px;
    }

    .site-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
    }

    .site-item:last-child {
      border-bottom: none;
    }

    .site-info {
      flex: 1;
    }

    .site-domain {
      font-size: 13px;
      font-weight: 600;
      color: #1f2937;
    }

    .site-time {
      font-size: 11px;
      color: #6b7280;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #9ca3af;
      font-size: 13px;
    }

    .focus-active {
      background: #d1fae5;
      border: 2px solid #10b981;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      text-align: center;
    }

    .focus-text {
      font-weight: 600;
      color: #065f46;
      margin-bottom: 8px;
    }

    .focus-time {
      font-size: 24px;
      font-weight: 700;
      color: #047857;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>FocusTrack AI</h1>
      <p class="subtitle">Your productivity companion</p>
    </div>

    <!-- Productivity Score -->
    <div class="score-card">
      <div class="score-label">Today's Productivity Score</div>
      <div class="score-value" id="score">--%</div>
      <div class="score-details">
        <span id="productiveTime">--</span> productive · <span id="distractingTime">--</span> distracting
      </div>
    </div>

    <!-- Current Site -->
    <div class="section" id="currentSection" style="display:none;">
      <div class="section-title">Currently Tracking</div>
      <div class="current-site">
        <div class="current-domain" id="currentDomain">-</div>
        <div class="current-time" id="currentTime">--</div>
        <span class="category-badge" id="currentCategory">-</span>
      </div>
    </div>

    <!-- Focus Session -->
    <div class="section">
      <div id="focusActive" style="display:none;">
        <div class="focus-active">
          <div class="focus-text">🎯 Focus Session Active</div>
          <div class="focus-time" id="focusTime">--</div>
        </div>
        <button class="btn btn-primary btn-full" id="endFocusBtn">End Session</button>
      </div>

      <div id="focusStart">
        <div class="section-title">Start Focus Session</div>
        <div class="focus-buttons">
          <button class="btn btn-primary" data-duration="25">25 min</button>
          <button class="btn btn-primary" data-duration="45">45 min</button>
          <button class="btn btn-primary" data-duration="60">60 min</button>
        </div>
      </div>
    </div>

    <!-- Top Sites -->
    <div class="section">
      <div class="section-title">Top Sites Today</div>
      <div id="topSitesList"></div>
    </div>

    <!-- Dashboard Button -->
    <button class="btn btn-primary btn-full" id="openDashboardBtn">Open Full Dashboard</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
