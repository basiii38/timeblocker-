<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusTrack AI - Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
      min-height: 100vh;
    }

    .header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 14px;
      color: #6b7280;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #e5e7eb;
    }

    .stat-label {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: #667eea;
    }

    .chart-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #e5e7eb;
      margin-bottom: 32px;
    }

    .chart-card h2 {
      font-size: 18px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 12px;
      font-weight: 600;
      color: #4b5563;
      border-bottom: 2px solid #e5e7eb;
      font-size: 13px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
    }

    tr:hover {
      background: #f9fafb;
    }

    .category-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .productive {
      background: #d1fae5;
      color: #065f46;
    }

    .distracting {
      background: #fee2e2;
      color: #991b1b;
    }

    .neutral {
      background: #fef3c7;
      color: #92400e;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #9ca3af;
    }

    .empty h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .empty p {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>FocusTrack AI Dashboard</h1>
    <p>Productivity Analytics</p>
  </div>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Productivity Score</div>
        <div class="stat-value" id="scoreValue">--%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Productive Time</div>
        <div class="stat-value" style="color: #10b981;" id="productiveValue">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Distracting Time</div>
        <div class="stat-value" style="color: #ef4444;" id="distractingValue">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Tracked</div>
        <div class="stat-value" style="color: #1f2937;" id="totalValue">--</div>
      </div>
    </div>

    <div class="chart-card">
      <h2>Site Breakdown</h2>
      <table id="sitesTable">
        <thead>
          <tr>
            <th>Site</th>
            <th>Category</th>
            <th>Time Spent</th>
            <th>Percentage</th>
          </tr>
        </thead>
        <tbody id="sitesTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
